<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אישור הגעה לחתונה</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b2622; --muted:#7a7168; --gold:#b08d57; --bg:#faf7f2; --card:#fff; --line:#e8e0d5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Heebo,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:24px 20px 64px; }
  .hero { text-align:center; padding:32px 8px 8px; }
  .hero .small { letter-spacing:.2em; color:var(--gold); font-size:13px; }
  .hero h1 { font-family:"Frank Ruhl Libre",serif; font-size:40px; margin:12px 0 4px; line-height:1.15; }
  .hero .names { font-family:"Frank Ruhl Libre",serif; font-size:30px; margin:8px 0; }
  .hero p { color:var(--muted); line-height:1.7; white-space:pre-line; }
  .details { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:16px 0 4px; }
  .pill { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:8px 16px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; margin-top:20px; box-shadow:0 2px 12px rgba(0,0,0,.04); }
  .card h2 { font-family:"Frank Ruhl Libre",serif; margin:0 0 4px; font-size:24px; }
  .card .sub { color:var(--muted); margin:0 0 20px; }
  .q { margin-bottom:22px; }
  .q label.title { display:block; font-weight:700; margin-bottom:10px; font-size:17px; }
  .opts { display:flex; gap:10px; }
  .opts button { flex:1; padding:13px 6px; border:1.5px solid var(--line); background:#fff; border-radius:12px; font-size:16px; font-family:inherit; cursor:pointer; }
  .opts button.sel { border-color:var(--gold); background:#f7efe2; font-weight:700; }
  .numrow { display:flex; align-items:center; gap:12px; }
  .numrow button { width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); background:#fff; font-size:22px; cursor:pointer; }
  .numrow .num { font-size:26px; font-weight:700; min-width:44px; text-align:center; }
  .save { width:100%; padding:15px; border:0; border-radius:14px; background:var(--ink); color:#fff; font-size:18px; font-family:inherit; cursor:pointer; margin-top:6px; }
  .save:disabled { opacity:.5; }
  .msg { text-align:center; padding:12px; border-radius:12px; margin-top:14px; display:none; }
  .msg.ok { display:block; background:#eef6ee; color:#2e6b34; }
  .msg.err { display:block; background:#fbeeee; color:#8a2c2c; }
  .pack { display:none; margin-top:20px; border-top:1px dashed var(--line); padding-top:18px; }
  .pack.show { display:block; }
  .pack pre { white-space:pre-line; font-family:inherit; line-height:1.8; background:#faf7f2; border-radius:12px; padding:14px 18px; margin:10px 0; }
  .pack a.btn, a.btn { display:inline-block; text-decoration:none; background:#25D366; color:#fff; padding:12px 20px; border-radius:999px; font-weight:700; }
  .center { text-align:center; }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="small">✦ ההזמנה שלכם ✦</div>
    <h1 id="greet">שלום!</h1>
    <div class="names" id="couple"></div>
    <p id="info"></p>
    <div class="details" id="details"></div>
  </div>

  <div class="card" id="formCard">
    <h2>אישור הגעה</h2>
    <p class="sub">אפשר לחזור לקישור הזה בכל זמן ולשנות את התשובות — השינוי יתעדכן אצלנו אוטומטית.</p>

    <div class="q">
      <label class="title">1. מגיעים לחתונה?</label>
      <div class="opts" id="attOpts">
        <button data-v="yes">כן 🎉</button>
        <button data-v="maybe">אולי 🤔</button>
        <button data-v="no">לא 😔</button>
      </div>
    </div>

    <div class="q">
      <label class="title">2. כמה תגיעו?</label>
      <div class="numrow">
        <button id="minus" type="button">−</button>
        <span class="num" id="count">0</span>
        <button id="plus" type="button">+</button>
        <span class="muted" id="invitedHint"></span>
      </div>
    </div>

    <div class="q">
      <label class="title">3. נשארים לישון?</label>
      <div class="opts" id="ovnOpts">
        <button data-v="yes">כן 🛏️</button>
        <button data-v="maybe">אולי 🤔</button>
        <button data-v="no">לא</button>
      </div>
    </div>

    <button class="save" id="saveBtn">שמור את התשובות</button>
    <div class="msg" id="msg"></div>

    <div class="pack" id="pack">
      <h2>רשימת ציוד ללינה 🧳</h2>
      <pre id="packText"></pre>
      <div class="center"><a class="btn" id="packWa" href="#" target="_blank">שלחו לי את הרשימה בוואטסאפ</a></div>
      <p class="muted center" style="margin-top:10px">אפשר גם פשוט לצלם מסך — הרשימה תישאר כאן בקישור שלכם.</p>
    </div>
  </div>

  <p class="muted center" id="foot"></p>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('g') || '';
let state = { attending: '', overnight: '', count: 0 };
let settings = {};
let household = {};

function pick(btns, val) {
  btns.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.v === val));
}
function showMsg(text, ok) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err');
}
function updatePack() {
  const show = state.overnight === 'yes' || state.overnight === 'maybe';
  document.getElementById('pack').classList.toggle('show', show);
  if (show) document.getElementById('packText').textContent = settings.packing_list || '';
}
function setCount(n) {
  state.count = Math.max(0, Math.min(30, n));
  document.getElementById('count').textContent = state.count;
}

async function load() {
  if (!token) {
    document.getElementById('formCard').innerHTML = '<h2>קישור לא תקין</h2><p class="sub">נראה שהקישור הזה לא מכיל קוד הזמנה. בקשו מבני הזוג קישור חדש.</p>';
    return;
  }
  const res = await fetch('/api/guest?g=' + encodeURIComponent(token));
  if (!res.ok) {
    document.getElementById('formCard').innerHTML = '<h2>קישור לא תקין</h2><p class="sub">לא מצאנו הזמנה עם הקוד הזה.</p>';
    return;
  }
  const data = await res.json();
  household = data.household; settings = data.settings;
  document.getElementById('greet').textContent = 'שלום, ' + household.display_name + '! 💍';
  document.getElementById('couple').textContent = settings.couple_names || '';
  document.getElementById('info').textContent = settings.info_text || '';
  const det = document.getElementById('details');
  const parts = [];
  if (settings.wedding_date) parts.push('📅 ' + settings.wedding_date + (settings.wedding_time ? ' · ' + settings.wedding_time : ''));
  if (settings.venue) parts.push('📍 ' + settings.venue);
  if (settings.address) parts.push(settings.address);
  det.innerHTML = parts.map(p => '<span class="pill">' + p + '</span>').join('');
  if (household.invited_total) document.getElementById('invitedHint').textContent = '(הוזמנתם: עד ' + household.invited_total + ')';
  if (data.response) {
    state.attending = data.response.attending || '';
    state.overnight = data.response.overnight || '';
    setCount(data.response.party_count || 0);
    pick(document.getElementById('attOpts'), state.attending);
    pick(document.getElementById('ovnOpts'), state.overnight);
    updatePack();
  }
  // WhatsApp self-send for the packing list (only meaningful if we know their number;
  // otherwise the button just copies the list)
  const wa = document.getElementById('packWa');
  wa.addEventListener('click', async (e) => {
    e.preventDefault();
    try { await navigator.clipboard.writeText(settings.packing_list || ''); showMsg('הרשימה הועתקה — אפשר להדביק אותה בכל מקום.', true); }
    catch (err) { showMsg('לא הצלחנו להעתיק אוטומטית — אפשר לסמן ולהעתיק ידנית.', false); }
  });
  wa.textContent = 'העתק את הרשימה';
}
document.getElementById('attOpts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.attending = b.dataset.v; pick(document.getElementById('attOpts'), state.attending);
});
document.getElementById('ovnOpts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.overnight = b.dataset.v; pick(document.getElementById('ovnOpts'), state.overnight); updatePack();
});
document.getElementById('plus').addEventListener('click', () => setCount(state.count + 1));
document.getElementById('minus').addEventListener('click', () => setCount(state.count - 1));
document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!state.attending) { showMsg('בחרו בבקשה אם אתם מגיעים.', false); return; }
  if (!state.overnight) { showMsg('בחרו בבקשה אם אתם נשארים לישון.', false); return; }
  const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'שומר…';
  const res = await fetch('/api/guest/response', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, attending: state.attending, party_count: state.count, overnight: state.overnight }) });
  btn.disabled = false; btn.textContent = 'שמור את התשובות';
  if (res.ok) { showMsg('תודה! התשובות נשמרו 💛 אפשר לחזור ולשנות בכל זמן.', true); updatePack(); }
  else showMsg('משהו השתבש בשמירה, נסו שוב.', false);
});
load();
</script>
</body>
</html>
